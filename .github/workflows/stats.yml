name: generate stats cards
on:
  schedule:
    - cron: "52 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: fetch stats card
        run: |
          curl -sL "https://github-readme-stats.vercel.app/api?username=supremeloki&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&theme=dracula&locale=en&hide_border=false" -o stats.svg
          sleep 3
          curl -sL "https://github-readme-stats.vercel.app/api/top-langs/?username=supremeloki&locale=en&hide_title=false&layout=compact&card_width=320&langs_count=5&theme=dracula&hide_border=false" -o langs.svg
          curl -sL "https://github-readme-streak-stats.herokuapp.com/?user=supremeloki&theme=dracula&hide_border=false" -o streak.svg
      - name: validate svgs
        run: |
          for f in stats.svg langs.svg streak.svg; do
            head -c 200 "$f" | grep -qi "<svg" || { echo "$f invalid"; cat "$f" | head -5; exit 1; }
          done
      - name: push cards
        run: |
          mkdir -p stats-output languages-output streak-output
          cp stats.svg stats-output/stats.svg
          cp langs.svg languages-output/languages.svg
          cp streak.svg streak-output/streak.svg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: refresh stat cards" || exit 0
          git push origin HEAD:pacman-output --force
