name: generate pacman contributions
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: aha-999/pacman-contribution-graph@main
        with:
          github_user_name: supremeloki
          svg_output_path: pacman-output/pacman-contribution-graph.svg
          svg_output_path_dark: pacman-output/pacman-contribution-graph-dark.svg
      - name: push pacman graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pacman-output
          git commit -m "chore: update pacman graph" || exit 0
          git push origin HEAD:pacman-output --force
