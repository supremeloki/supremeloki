name: generate pacman contributions
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: supremeloki
      - name: publish to pacman-output branch
        run: |
          mkdir -p out
          find . -maxdepth 1 -name "*.svg" -exec cp {} out/ \; || true
          ls -la out/
          cd out
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh pacman graph" || exit 0
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/supremeloki/supremeloki.git" main:pacman-output
